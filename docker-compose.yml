version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
    ports:
      - "5015:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      network: host
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - JWT_SECRET=${JWT_SECRET:-knomap_super_secret_jwt_key_2026_change_in_production_environment_998877665544332211}
      - DOTNET_RUNNING_IN_CONTAINER=true
      - LLM_BASE_URL=${LLM_BASE_URL:-http://172.17.0.1:1234/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-default}
    volumes:
      - knomap_data:/app/backend/App_Data
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

volumes:
  knomap_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/expansion/dockers_drives/knomap_data
